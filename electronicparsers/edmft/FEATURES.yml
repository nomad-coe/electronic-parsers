metadata:
  last_updated: '2025-12-12'
  updated_by: GitHub Copilot
parser:
  name: eDMFT
  description: Embedded Dynamical Mean Field Theory code for strongly correlated systems
  homepage: http://hauleweb.rutgers.edu/tutorials/
  mainfile_patterns:
  - '*.out'
  supported_file_formats:
  - name: '*.out'
    supported: true
    notes: Primary output file
    source: packages/nomad-parser-plugins-electronic/electronicparsers/edmft/parser.py:EDMFTParser.parse
runschema_capabilities:
  run:
  - capability: program
    source: packages/nomad-parser-plugins-electronic/electronicparsers/edmft/parser.py:EDMFTParser.parse
  method:
  - capability: electronic.method
    source: packages/nomad-parser-plugins-electronic/electronicparsers/edmft/parser.py:EDMFTParser.parse
  system:
  - capability: atoms
    source: packages/nomad-parser-plugins-electronic/electronicparsers/edmft/parser.py:EDMFTParser.parse
  calculation:
  - capability: energy.total
    source: packages/nomad-parser-plugins-electronic/electronicparsers/edmft/parser.py:EDMFTParser.parse
  workflow:
  - capability: dmft
    source: packages/nomad-parser-plugins-electronic/electronicparsers/edmft/parser.py:EDMFTParser.parse
special_features:
- Dynamical Mean Field Theory (DMFT) approach
- Treatment of strongly correlated electron systems
- Embedded impurity solvers
notes:
- Specialized for DMFT calculations
- Treats strong electron correlations beyond DFT
