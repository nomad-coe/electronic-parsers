metadata:
  last_updated: "2025-12-11"
  updated_by: "Claude Sonnet 4.5"

parser:
  name: "ONETEP"
  description: "Order-N Electronic Total Energy Package - linear-scaling DFT"
  homepage: "https://www.onetep.org/"
  mainfile_patterns:
    - "*.out"
  supported_file_formats:
    - name: "*.out"
      supported: true
      notes: "Primary output file"
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/onetep/parser.py:OnetepParser.parse"

runschema_capabilities:
  run:
    - capability: program
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/onetep/parser.py:OnetepParser.parse"

  method:
    - capability: electronic.method
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/onetep/parser.py:OnetepParser.parse"
    - capability: dft.xc_functional
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/onetep/parser.py:OnetepParser.parse"
    - capability: basis_set
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/onetep/parser.py:OnetepParser.parse"

  system:
    - capability: atoms
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/onetep/parser.py:OnetepParser.parse"

  calculation:
    - capability: energy.total
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/onetep/parser.py:OnetepParser.parse"
    - capability: forces.total
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/onetep/parser.py:OnetepParser.parse"

  workflow:
    - capability: single_point
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/onetep/parser.py:OnetepParser.parse"

special_features:
  - "Linear-scaling DFT (O(N) complexity)"
  - "Non-orthogonal generalized Wannier functions (NGWFs)"
  - "Large system calculations (thousands of atoms)"

notes:
  - "Linear-scaling enables very large system calculations"
  - "NGWF basis set optimization"
