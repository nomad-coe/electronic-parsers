metadata:
  last_updated: "2025-12-11"
  updated_by: "Claude Sonnet 4.5"

parser:
  name: "FPLO"
  description: "Full-Potential Local-Orbital DFT code for solids"
  homepage: "https://www.fplo.de/"
  mainfile_patterns:
    - "+log"
  supported_file_formats:
    - name: "+log"
      supported: true
      notes: "Primary log file"
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/fplo/parser.py:FploParser.parse"

runschema_capabilities:
  run:
    - capability: program
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/fplo/parser.py:FploParser.parse"

  method:
    - capability: electronic.method
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/fplo/parser.py:FploParser.parse"
    - capability: dft.xc_functional
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/fplo/parser.py:FploParser.parse"

  system:
    - capability: atoms
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/fplo/parser.py:FploParser.parse"

  calculation:
    - capability: energy.total
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/fplo/parser.py:FploParser.parse"

  workflow:
    - capability: single_point
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/fplo/parser.py:FploParser.parse"

special_features:
  - "Full-potential local-orbital method"
  - "Optimized for solid-state calculations"

notes:
  - "Uses local orbitals instead of plane waves"
  - "Full-potential all-electron approach"
