metadata:
  last_updated: '2025-12-12'
  updated_by: GitHub Copilot
parser:
  name: Psi4
  description: Open-source quantum chemistry package for high-accuracy calculations
  homepage: https://psicode.org/
  mainfile_patterns:
  - '*.out'
  - '*.dat'
  supported_file_formats:
  - name: '*.out'
    supported: true
    notes: Primary output file
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
runschema_capabilities:
  run:
  - capability: program
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
  method:
  - capability: electronic.method
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
  - capability: dft.xc_functional
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
  - capability: basis_set
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
  system:
  - capability: atoms
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
  calculation:
  - capability: energy.total
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
  - capability: forces.total
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
  - capability: eigenvalues
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
  workflow:
  - capability: single_point
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
  - capability: geometry_optimization
    source: packages/nomad-parser-plugins-electronic/electronicparsers/psi4/parser.py:Psi4Parser.parse
special_features:
- Wide range of ab initio methods (HF, DFT, MP2, CCSD, SAPT)
- Symmetry-adapted perturbation theory (SAPT)
- Density fitting and Cholesky decomposition
- Python-based interface
notes:
- Modern Python-based quantum chemistry package
- Extensive method library
