metadata:
  last_updated: "2025-12-12"
  updated_by: "GitHub Copilot"
parser:
  name: "ORCA"
  description: "ORCA - quantum chemistry program for molecular systems with focus on spectroscopy"
  homepage: "https://www.faccts.de/orca/"
  mainfile_patterns:
  - "*.out"
  supported_file_formats:
  - name: "*.out"
    supported: true
    notes: "*.out (primary output file)"
    source: "electronicparsers/orca/parser.py:OutParser.init_parser"
runschema_capabilities:
  run:
  - capability: "program"
    source: "electronicparsers/orca/parser.py:OutParser.parse"
  method:
  - capability: "electronic.method"
    source: "electronicparsers/orca/parser.py:OutParser.parse_method"
  - capability: "dft.xc_functional"
    source: "electronicparsers/orca/parser.py:OutParser.parse_method"
  - capability: "basis_set"
    source: "electronicparsers/orca/parser.py:OutParser.parse_method"
  - capability: "scf"
    source: "electronicparsers/orca/parser.py:OutParser.parse_method"
  system:
  - capability: "atoms"
    source: "electronicparsers/orca/parser.py:OutParser.parse_system"
  - capability: "atoms.labels"
    source: "electronicparsers/orca/parser.py:OutParser.parse_system"
  - capability: "atoms.positions"
    source: "electronicparsers/orca/parser.py:OutParser.parse_system"
  calculation:
  - capability: "energy.total"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "energy.nuclear_repulsion"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "energy.kinetic"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "energy.potential"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "energy.xc"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "energy.exchange"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "energy.correlation"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "scf_iteration"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "band_structure_electronic"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "eigenvalues"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "charges"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  - capability: "spectra"
    source: "electronicparsers/orca/parser.py:OutParser.parse_configurations"
  workflow:
  - capability: "single_point"
    source: "electronicparsers/orca/parser.py:OutParser.parse"
  - capability: "geometry_optimization"
    source: "electronicparsers/orca/parser.py:OutParser.parse"
special_features:
- Comprehensive DFT functionals: "LDA (VWN, PWLDA), GGA (BP86, PW91, PBE, BLYP, OLYP), meta-GGA (TPSS, M06L)'"
- Hybrid functionals: "B3LYP, PBE0, TPSSh, B3PW91, M06, M062X, O3LYP, X3LYP, PW6B95'"
- Double-hybrid functionals: "B2PLYP, mB2PLYP, PWPB95'"
- Range-separated functionals: "CAM-B3LYP, ωB97, ωB97X'"
- Dispersion corrections: "DFT-D2, DFT-D3, DFT-D4'"
- Post-HF methods: "MP2, MP3, CCSD, CCSD(T), local correlation methods'"
- Coupled-cluster methods: "DLPNO-CCSD(T) for large systems'"
- Multi-reference methods: "CASSCF, NEVPT2, MRCI'"
- SCF convergence tiers: "SloppySCF, LooseSCF, NormalSCF, StrongSCF, TightSCF, VeryTightSCF, ExtremeSCF'"
- "Gaussian-type basis sets with auxiliary basis sets for RI approximations"
- "Split-RI-J for efficient Coulomb potential evaluation"
- Spectroscopy focus: "UV/Vis, IR, Raman, NMR, EPR, Mössbauer'"
- "Time-dependent DFT for excited states"
- "Spin-orbit coupling calculations"
- "Solvent effects via COSMO, CPCM, SMD"
notes:
- "ORCA specializes in molecular spectroscopy and transition metal chemistry"
- "Strong support for correlated wavefunction methods and local correlation"
- "Parser handles DFT, HF, and post-HF calculations"
- "Extracts detailed SCF convergence data including density changes"
- "Basis set information includes both wavefunction and auxiliary basis sets"
