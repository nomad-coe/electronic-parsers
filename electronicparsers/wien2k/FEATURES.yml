metadata:
  last_updated: "2025-12-12"
  updated_by: "GitHub Copilot"
parser:
  name: "WIEN2k"
  description: "WIEN2k - all-electron full-potential (linearized) augmented plane-wave + local orbitals (FP-LAPW+lo) DFT code"
  homepage: "http://www.wien2k.at/"
  mainfile_patterns:
  - "*.scf"
  supported_file_formats:
  - name: "*.scf"
    supported: true
    notes: "*.scf (primary output file)"
    source: "electronicparsers/wien2k/parser.py:In0Parser.init_parser"
  - name: "*.struct"
    supported: true
    notes: "*.struct (structure file)"
    source: "electronicparsers/wien2k/parser.py:In0Parser.init_parser"
  - name: "*.in0"
    supported: true
    notes: "*.in0 (density synthesis parameters)"
    source: "electronicparsers/wien2k/parser.py:In0Parser.init_parser"
  - name: "*.in1"
    supported: true
    notes: "*.in1 (LAPW basis set parameters)"
    source: "electronicparsers/wien2k/parser.py:In0Parser.init_parser"
  - name: "*.in2"
    supported: true
    notes: "*.in2 (SCF parameters)"
    source: "electronicparsers/wien2k/parser.py:In0Parser.init_parser"
  - name: "*.inc"
    supported: true
    notes: "*.inc (additional case-specific parameters)"
    source: "electronicparsers/wien2k/parser.py:In0Parser.init_parser"
  - name: "*.klist"
    supported: true
    notes: "*.klist (k-point list)"
    source: "electronicparsers/wien2k/parser.py:In0Parser.init_parser"
  - name: "*.energy*"
    supported: true
    notes: "*.energy* (eigenvalues)"
    source: "electronicparsers/wien2k/parser.py:In0Parser.init_parser"
  - name: "*.dos*"
    supported: true
    notes: "*.dos* (density of states)"
    source: "electronicparsers/wien2k/parser.py:In0Parser.init_parser"
