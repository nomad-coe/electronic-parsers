special_features:
- "Density Functional Perturbation Theory (DFPT) for phonons and linear response"
- "Phonon calculations with IR and Raman intensities"
- "Raman tensor calculations for vibrational spectroscopy"
- "Time-Dependent DFT (TDDFT) for excited states and optical properties"
- "Transition state search algorithms (QST, LST/QST, NEB)"
- "Variable-cell optimization for lattice parameter relaxation"
- "Multiple optimization algorithms (BFGS, LBFGS, damped MD, FIRE)"
- "Molecular dynamics with NVE, NVT (Nose-Hoover, Langevin), NPT ensembles"
- "On-the-fly pseudopotential generation"
- "DFT-D dispersion corrections (various SEDC schemes)"
- "Core-level spectroscopy (XPS, EELS) calculations"
- "NMR chemical shift calculations (CASTEP-NMR variant)"
- "Electric field gradients and hyperfine parameters"
- "Basis set correction (BS_correction) for improved energy differences"
- "Extensive library of ultrasoft pseudopotentials"
- "Symmetry-adapted k-point sampling"
notes:
- "CASTEP primarily uses .castep extension for output files"
- ".cell file contains structure and constraints"
- ".param file contains calculation parameters"
- task parameter defines calculation type: "singlepoint, geometryoptimisation, moleculardynamics, phonon, etc.'"
- Band structure calculations require separate spectral_task: "bandstructure'"
- "Phonon calculations produce extensive output with normal modes, Born charges, dielectric constants"
- "Raman tensors computed from second derivatives via DFPT"
- "TDDFT available for optical absorption and excitation energies"
- "Transition state search via QST (Quadratic Synchronous Transit) or NEB (Nudged Elastic Band)"
- "Strong focus on solid-state and materials properties"
- "Efficient parallelization for large systems"
- "Integrated with Materials Studio GUI"
