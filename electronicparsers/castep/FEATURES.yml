  supported_file_formats:
  - name: "CASTEP output files"
    supported: true
    notes: "CASTEP output files (.castep)"
    source: "electronicparsers/castep/parser.py:CellParser.init_parser"
  - name: "Cell files"
    supported: true
    notes: "Cell files (.cell) for structure"
    source: "electronicparsers/castep/parser.py:CellParser.init_parser"
  - name: "Param files"
