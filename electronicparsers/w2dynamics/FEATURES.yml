metadata:
  last_updated: '2025-12-12'
  updated_by: GitHub Copilot
parser:
  name: w2dynamics
  description: Continuous-time quantum Monte Carlo solver for DMFT calculations
  homepage: https://github.com/w2dynamics/w2dynamics
  mainfile_patterns:
  - '*.h5'
  - '*.hdf5'
  supported_file_formats:
  - name: '*.h5'
    supported: true
    notes: HDF5 output file
    source: packages/nomad-parser-plugins-electronic/electronicparsers/w2dynamics/parser.py:W2DynamicsParser.parse
runschema_capabilities:
  run:
  - capability: program
    source: packages/nomad-parser-plugins-electronic/electronicparsers/w2dynamics/parser.py:W2DynamicsParser.parse
  method:
  - capability: electronic.method
    source: packages/nomad-parser-plugins-electronic/electronicparsers/w2dynamics/parser.py:W2DynamicsParser.parse
  system:
  - capability: atoms
    source: packages/nomad-parser-plugins-electronic/electronicparsers/w2dynamics/parser.py:W2DynamicsParser.parse
  calculation:
  - capability: energy.total
    source: packages/nomad-parser-plugins-electronic/electronicparsers/w2dynamics/parser.py:W2DynamicsParser.parse
  workflow:
  - capability: dmft
    source: packages/nomad-parser-plugins-electronic/electronicparsers/w2dynamics/parser.py:W2DynamicsParser.parse
special_features:
- Continuous-time quantum Monte Carlo (CT-QMC) impurity solver
- Dynamical Mean Field Theory (DMFT) calculations
- Treatment of strongly correlated electron systems
- HDF5-based structured output
notes:
- Specialized DMFT impurity solver
- Uses quantum Monte Carlo methods
- HDF5 format for output data
