metadata:
  last_updated: "2025-12-12"
  updated_by: "GitHub Copilot"
parser:
  name: "Molcas"
  description: "Molcas/OpenMolcas - quantum chemistry package for multiconfigurational methods"
  homepage: "http://molcas.org/"
  mainfile_patterns:
  - "*.out"
  - "*.log"
  supported_file_formats:
  - name: "*.out"
    supported: true
    notes: "Primary output file"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/molcas/parser.py:MolcasParser.parse"
runschema_capabilities:
  run:
  - capability: "program"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/molcas/parser.py:MolcasParser.parse"
  method:
  - capability: "electronic.method"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/molcas/parser.py:MolcasParser.parse"
  - capability: "basis_set"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/molcas/parser.py:MolcasParser.parse"
  system:
  - capability: "atoms"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/molcas/parser.py:MolcasParser.parse"
  calculation:
  - capability: "energy.total"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/molcas/parser.py:MolcasParser.parse"
  workflow:
  - capability: "single_point"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/molcas/parser.py:MolcasParser.parse"
special_features:
- "Multiconfigurational methods (CASSCF, CASPT2, RASSCF)"
- "Excited state calculations"
- "Spin-orbit coupling"
- "Relativistic effects"
notes:
- "Specialized in multiconfigurational methods"
- "Strong focus on excited states and spectroscopy"
