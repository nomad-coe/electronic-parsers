metadata:
  last_updated: "2025-12-11"
  updated_by: "Claude Sonnet 4.5"

parser:
  name: "Elk"
  description: "All-electron full-potential linearized augmented-plane-wave (FP-LAPW) DFT code"
  homepage: "http://elk.sourceforge.net/"
  mainfile_patterns:
    - "INFO.OUT"
  supported_file_formats:
    - name: "INFO.OUT"
      supported: true
      notes: "Primary output file"
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/elk/parser.py:ElkParser.parse"

runschema_capabilities:
  run:
    - capability: program
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/elk/parser.py:ElkParser.parse"

  method:
    - capability: electronic.method
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/elk/parser.py:ElkParser.parse"
    - capability: dft.xc_functional
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/elk/parser.py:ElkParser.parse"
    - capability: basis_set
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/elk/parser.py:ElkParser.parse"
    - capability: k_mesh
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/elk/parser.py:ElkParser.parse"

  system:
    - capability: atoms
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/elk/parser.py:ElkParser.parse"

  calculation:
    - capability: energy.total
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/elk/parser.py:ElkParser.parse"
    - capability: eigenvalues
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/elk/parser.py:ElkParser.parse"

  workflow:
    - capability: single_point
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/elk/parser.py:ElkParser.parse"

special_features:
  - "Full-potential LAPW method"
  - "All-electron calculations (no pseudopotentials)"
  - "High accuracy for electronic structure"
  - "Spin-orbit coupling"

notes:
  - "All-electron full-potential method"
  - "LAPW basis set"
