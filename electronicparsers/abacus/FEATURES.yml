metadata:
  last_updated: "2025-12-11"
  updated_by: "Claude Sonnet 4.5"

parser:
  name: "ABACUS"
  description: "Atomic-orbital Based Ab-initio Computation at UStc - DFT code with plane-wave and numeric atomic orbital basis sets"
  homepage: "http://abacus.ustc.edu.cn/"
  mainfile_patterns:
    - "running_*.log"
  supported_file_formats:
    - name: "running_*.log"
      supported: true
      notes: "Primary output file"
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/abacus/parser.py:ABACUSParser.init_parser"
    - name: "INPUT"
      supported: true
      notes: "Input parameters file"
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/abacus/parser.py:ABACUSParser.parse_method"
    - name: "STRU"
      supported: true
      notes: "Structure file"
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/abacus/parser.py:ABACUSParser.parse_configurations"
    - name: "KPT"
      supported: true
      notes: "K-points file"
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/abacus/parser.py:ABACUSParser.parse_method"
    - name: "TDOS"
      supported: true
      notes: "Total density of states"
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/abacus/parser.py:ABACUSParser.parse_configurations"

