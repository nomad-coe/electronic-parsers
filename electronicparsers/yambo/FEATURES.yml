metadata:
  last_updated: "2025-12-11"
  updated_by: "Claude Sonnet 4.5"

parser:
  name: "Yambo"
  description: "Many-body calculations using GW and Bethe-Salpeter equation approaches"
  homepage: "http://www.yambo-code.org/"
  mainfile_patterns:
    - "*.out"
    - "o-*"
  supported_file_formats:
    - name: "*.out"
      supported: true
      notes: "Primary output file"
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/yambo/parser.py:YamboParser.parse"

runschema_capabilities:
  run:
    - capability: program
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/yambo/parser.py:YamboParser.parse"

  method:
    - capability: electronic.method
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/yambo/parser.py:YamboParser.parse"

  system:
    - capability: atoms
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/yambo/parser.py:YamboParser.parse"

  calculation:
    - capability: energy.total
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/yambo/parser.py:YamboParser.parse"
    - capability: eigenvalues
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/yambo/parser.py:YamboParser.parse"

  workflow:
    - capability: gw
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/yambo/parser.py:YamboParser.parse"
    - capability: bse
      source: "packages/nomad-parser-plugins-electronic/electronicparsers/yambo/parser.py:YamboParser.parse"

special_features:
  - "GW approximation for quasiparticle energies"
  - "Bethe-Salpeter equation (BSE) for excitations"
  - "Optical absorption and EELS spectra"
  - "Time-dependent screening"
  - "Interfaces with DFT codes (Quantum ESPRESSO, Abinit, etc.)"

notes:
  - "Specialized for many-body perturbation theory"
  - "Post-processing tool for DFT outputs"
  - "Focus on excited-state properties and spectroscopy"
