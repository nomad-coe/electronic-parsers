metadata:
  last_updated: "2025-12-12"
  updated_by: "GitHub Copilot"
parser:
  name: "Quantum ESPRESSO"
  description: "Quantum ESPRESSO - integrated suite of open-source codes for electronic structure and materials modeling"
  homepage: "https://www.quantum-espresso.org/"
  mainfile_patterns:
  - "**/pw.*.out"
  - "**/pwscf.out"
  - "**/cp.*.out"
  - "**/ph.*.out"
  supported_file_formats:
  - name: "pw.x output"
    supported: true
    notes: "pw.x output (DFT calculations)"
    source: "electronicparsers/quantumespresso/parser.py:QuantumEspressoRunParser.init_parser"
  - name: "cp.x output"
    supported: true
    notes: "cp.x output (Car-Parrinello MD)"
    source: "electronicparsers/quantumespresso/parser.py:QuantumEspressoRunParser.init_parser"
  - name: "ph.x output"
    supported: true
    notes: "ph.x output (phonon calculations)"
    source: "electronicparsers/quantumespresso/parser.py:QuantumEspressoRunParser.init_parser"
  - name: "pp.x output"
    supported: true
    notes: "pp.x output (post-processing)"
    source: "electronicparsers/quantumespresso/parser.py:QuantumEspressoRunParser.init_parser"
  - name: "XML data files"
    supported: true
    notes: "XML data files (data-file-schema.xml)"
    source: "electronicparsers/quantumespresso/parser.py:QuantumEspressoRunParser.init_parser"
