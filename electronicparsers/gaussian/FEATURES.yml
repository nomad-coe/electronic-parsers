  - capability: "energy.nuclear_repulsion"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_configurations"
  - capability: "energy.kinetic"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_configurations"
  - capability: "energy.potential"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_configurations"
  - capability: "energy.xc"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_configurations"
  - capability: "energy.exchange"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_configurations"
  - capability: "energy.correlation"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_configurations"
