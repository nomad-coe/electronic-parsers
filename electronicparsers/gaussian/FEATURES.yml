    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_method"
  - capability: "electronic.n_spin_channels"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_method"
  - capability: "dft.xc_functional"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_method"
  - capability: "basis_set"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_method"
  - capability: "scf"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse_method"
