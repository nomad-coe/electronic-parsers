metadata:
  last_updated: "2025-12-12"
  updated_by: "GitHub Copilot"
parser:
  name: "Gaussian"
  description: "Gaussian - comprehensive quantum chemistry package for molecular systems"
  homepage: "http://gaussian.com"
  mainfile_patterns:
  - "*.log"
  - "*.out"
  supported_file_formats:
  - name: "*.log"
    supported: true
    notes: "*.log (primary output file)"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.init_parser"
  - name: "*.out"
    supported: true
    notes: "*.out (output file)"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.init_parser"
runschema_capabilities:
  run:
  - capability: "program"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse"
  - capability: "time_run"
    source: "electronicparsers/gaussian/parser.py:GaussianOutParser.parse"
  method:
