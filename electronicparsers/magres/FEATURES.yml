metadata:
  last_updated: "2025-12-12"
  updated_by: "GitHub Copilot"
parser:
  name: "magres"
  description: "Magnetic resonance file format parser - for NMR and EPR calculations"
  homepage: "https://www.ccpnc.ac.uk/docs/magres"
  mainfile_patterns:
  - "*.magres"
  supported_file_formats:
  - name: "*.magres"
    supported: true
    notes: "Magres format file"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/magres/parser.py:MagresParser.parse"
runschema_capabilities:
  run:
  - capability: "program"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/magres/parser.py:MagresParser.parse"
  system:
  - capability: "atoms"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/magres/parser.py:MagresParser.parse"
  calculation:
  - capability: "energy.total"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/magres/parser.py:MagresParser.parse"
  workflow:
  - capability: "single_point"
    source: "packages/nomad-parser-plugins-electronic/electronicparsers/magres/parser.py:MagresParser.parse"
special_features:
- "NMR chemical shielding and shifts"
- "EPR g-tensors and hyperfine couplings"
- "Electric field gradients"
- "J-coupling constants"
notes:
- "Specialized format for magnetic resonance properties"
- "Output from various ab initio codes (CASTEP, Quantum ESPRESSO, etc.)"
