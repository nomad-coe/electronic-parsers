metadata:
  last_updated: '2025-12-12'
  updated_by: GitHub Copilot
parser:
  name: SIESTA
  description: Spanish Initiative for Electronic Simulations with Thousands of Atoms - DFT with numerical atomic orbitals
  homepage: https://siesta-project.org/
  mainfile_patterns:
  - '*.out'
  supported_file_formats:
  - name: '*.out'
    supported: true
    notes: Primary output file
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
runschema_capabilities:
  run:
  - capability: program
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  method:
  - capability: electronic.method
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  - capability: electronic.n_spin_channels
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  - capability: dft.xc_functional
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  - capability: basis_set
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  - capability: k_mesh
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  system:
  - capability: atoms
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  calculation:
  - capability: energy.total
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  - capability: energy.fermi
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  - capability: forces.total
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  - capability: eigenvalues
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  workflow:
  - capability: single_point
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
  - capability: geometry_optimization
    source: packages/nomad-parser-plugins-electronic/electronicparsers/siesta/parser.py:SiestaParser.parse
special_features:
- Numerical atomic orbital (NAO) basis sets
- O(N) methods for large systems
- DFT+U for correlated systems
- Non-collinear magnetism and spin-orbit coupling
notes:
- Efficient for large-scale calculations with NAO basis
- Linear-scaling methods available
