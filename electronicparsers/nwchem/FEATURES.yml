metadata:
  last_updated: '2025-12-12'
  updated_by: GitHub Copilot
parser:
  name: NWChem
  description: Northwest Computational Chemistry Package - comprehensive quantum chemistry package
  homepage: https://nwchemgit.github.io/
  mainfile_patterns:
  - '*.out'
  - '*.nwo'
  supported_file_formats:
  - name: '*.out'
    supported: true
    notes: Primary output file
    source: packages/nomad-parser-plugins-electronic/electronicparsers/nwchem/parser.py:NWChemParser.parse
runschema_capabilities:
  run:
  - capability: program
    source: packages/nomad-parser-plugins-electronic/electronicparsers/nwchem/parser.py:NWChemParser.parse
  method:
  - capability: electronic.method
    source: packages/nomad-parser-plugins-electronic/electronicparsers/nwchem/parser.py:NWChemParser.parse
  - capability: dft.xc_functional
    source: packages/nomad-parser-plugins-electronic/electronicparsers/nwchem/parser.py:NWChemParser.parse
  - capability: basis_set
    source: packages/nomad-parser-plugins-electronic/electronicparsers/nwchem/parser.py:NWChemParser.parse
  system:
  - capability: atoms
    source: packages/nomad-parser-plugins-electronic/electronicparsers/nwchem/parser.py:NWChemParser.parse
  calculation:
  - capability: energy.total
    source: packages/nomad-parser-plugins-electronic/electronicparsers/nwchem/parser.py:NWChemParser.parse
  - capability: forces.total
    source: packages/nomad-parser-plugins-electronic/electronicparsers/nwchem/parser.py:NWChemParser.parse
  workflow:
  - capability: single_point
    source: packages/nomad-parser-plugins-electronic/electronicparsers/nwchem/parser.py:NWChemParser.parse
  - capability: geometry_optimization
    source: packages/nomad-parser-plugins-electronic/electronicparsers/nwchem/parser.py:NWChemParser.parse
special_features:
- Wide range of QM methods (DFT, HF, MP2, CCSD, MCSCF)
- Plane-wave DFT module
- QM/MM capabilities
- Relativistic calculations
- Solvation models
notes:
- Comprehensive quantum chemistry package
- Both molecular and periodic DFT
