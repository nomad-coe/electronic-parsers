metadata:
  last_updated: "2025-12-12"
  updated_by: "GitHub Copilot"

parser:
  name: "VASP"
  description: "Vienna Ab initio Simulation Package - plane-wave DFT code"
  homepage: "https://www.vasp.at/"
  mainfile_patterns:
    - "**/vasprun.xml"
    - "**/vasprun.xml.gz"
    - "**/vasprun.xml.bz2"
    - "**/OUTCAR"
  supported_file_formats:
    - name: "vasprun.xml"
      supported: true
      notes: "Primary XML output format"
      source: "electronicparsers/vasp/parser.py:VASPParser.init_parser"
    - name: "OUTCAR"
      supported: true
      notes: "Fallback text output format"
      source: "electronicparsers/vasp/parser.py:VASPParser.init_parser"
    - name: "POTCAR"
      supported: true
      notes: "Pseudopotential information"
      source: "electronicparsers/vasp/parser.py:RunContentParser.get_pseudopotential"
    - name: "INCAR"
      supported: true
      notes: "Input parameters"
      source: "electronicparsers/vasp/parser.py:RunContentParser.get_incar"

